<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mini ATS</title>
<style>
  :root{--bg:#f5f6f8;--sf:#fff;--tx:#1b2238;--mu:#6a7390;--bd:#dfe3ec;--ac:#2c3e86;--ac2:#e8a33d;--ok:#2f8f5b;--no:#c4473a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12162a;--sf:#1b2038;--tx:#e8ebf5;--mu:#9aa3c4;--bd:#2b3254;--ac:#8fa2f0;--ac2:#f0b24f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12162a;--sf:#1b2038;--tx:#e8ebf5;--mu:#9aa3c4;--bd:#2b3254;--ac:#8fa2f0;--ac2:#f0b24f;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 "Public Sans",system-ui,-apple-system,Segoe UI,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--bd);background:var(--sf)}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:-.01em}h1 span{color:var(--ac2)}
nav{display:flex;gap:4px}nav button{border:0;background:none;color:var(--mu);padding:8px 14px;border-radius:8px;font:inherit;font-weight:600;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
.btn{background:var(--ac);color:#fff;border:0;padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--tx);border:1px solid var(--bd)}.btn.del{background:var(--no)}
main{padding:24px;max-width:1280px;margin:auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
.stat b{display:block;font-size:28px;line-height:1.1}.stat small{color:var(--mu)}
.panel{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:20px}
.panel h2{font-size:16px;margin:0 0 12px}
.bar{display:grid;grid-template-columns:90px 1fr 36px;gap:10px;align-items:center;margin:7px 0}
.bar i{display:block;height:14px;border-radius:7px;background:var(--ac);min-width:2px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.tools input,.tools select,.f input,.f select,.f textarea{background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:9px 12px;width:100%}
.tools input{flex:1;min-width:220px;width:auto}.tools select{width:auto}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px;min-height:200px}
.col.over{outline:2px dashed var(--ac2)}.col h3{font-size:13px;margin:2px 4px 10px;display:flex;justify-content:space-between}
.card{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:8px;cursor:grab}
.card b{display:block}.card small{color:var(--mu)}
.card select{margin-top:8px;width:100%;font-size:13px;padding:4px;background:var(--sf);border:1px solid var(--bd);border-radius:6px}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--bd);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-weight:600;cursor:pointer;white-space:nowrap}tr:last-child td{border:0}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--bd)}
.tag.Hired{background:var(--ok);color:#fff}.tag.Rejected{background:var(--no);color:#fff}.tag.Offer{background:var(--ac2);color:#222}
.link{background:none;border:0;color:var(--ac);cursor:pointer;font-weight:600;padding:0 6px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--sf);color:var(--tx);padding:22px;width:min(520px,94vw)}
dialog::backdrop{background:rgba(10,14,30,.55)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}.f label{font-size:13px;color:var(--mu);display:block}.f .w{grid-column:1/-1}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.empty{padding:28px;text-align:center;color:var(--mu)}
.hist{font-size:13px;color:var(--mu);margin:8px 0 0;padding-left:18px}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media(max-width:560px){.f{grid-template-columns:1fr}main{padding:14px}}

</style>


</head>
<body>
<header>
  <h1>Mini<span>ATS</span></h1>
  <nav id="nav"><button data-v="dash" class="on">Dashboard</button><button data-v="board">Pipeline</button><button data-v="list">Candidates</button></nav>
  <div><button class="btn ghost" id="exp">Export CSV</button> <button class="btn" id="add">Add candidate</button></div>
</header>
<main>
  <section id="dash"></section>
  <section id="board" hidden></section>
  <section id="list" hidden></section>
</main>
<dialog id="dlg"><form id="form" method="dialog" class="f" novalidate>
  <h2 class="w" id="dt" style="margin:0">Add candidate</h2>
  <div><label for="n">Full name *</label><input id="n" required></div>
  <div><label for="e">Email *</label><input id="e" type="email" required></div>
  <div><label for="p">Phone</label><input id="p"></div>
  <div><label for="r">Role applied *</label><input id="r" required list="roles"><datalist id="roles"></datalist></div>
  <div><label for="s">Stage</label><select id="s"></select></div>
  <div><label for="src">Source</label><select id="src"><option>LinkedIn</option><option>Referral</option><option>Job board</option><option>Campus</option><option>Website</option></select></div>
  <div class="w"><label for="nt">Notes</label><textarea id="nt" rows="3"></textarea></div>
  <div class="w" id="hw" hidden><label>Stage history</label><ul class="hist" id="hist"></ul></div>
  <div class="w row"><button type="button" class="btn del" id="rm" hidden>Delete</button><button type="button" class="btn ghost" id="cx">Cancel</button><button type="submit" class="btn">Save</button></div>
</form></dialog>
<div id="toast" role="status"></div>
<script>
const ST=["Applied","Screening","Interview","Offer","Hired","Rejected"],KEY="mini-ats-v1";
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const day=n=>new Date(Date.now()-n*864e5).toISOString();
let data=[],view="dash",editId=null,sort={k:"updated",d:-1};
async function api(u,o={}){const r=await fetch("/api"+u,{headers:{"Content-Type":"application/json"},...o});if(!r.ok){const b=await r.json().catch(()=>({}));throw new Error(b.error||"Request failed")}return r.status==204?null:r.json()}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}
const fd=d=>new Date(d).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});
const filters={q:"",stage:"",role:""};
function filtered(){const q=filters.q.toLowerCase();return data.filter(c=>(!filters.stage||c.stage==filters.stage)&&(!filters.role||c.role==filters.role)&&(!q||[c.name,c.email,c.role,c.source,c.notes,c.phone].join(" ").toLowerCase().includes(q)))}
function tools(){const roles=[...new Set(data.map(c=>c.role))].sort();return `<div class="tools"><input type="search" id="q" placeholder="Search name, email, role, notes" value="${esc(filters.q)}" aria-label="Search candidates"><select id="fs" aria-label="Filter by stage"><option value="">All stages</option>${ST.map(s=>`<option ${filters.stage==s?"selected":""}>${s}</option>`).join("")}</select><select id="fr" aria-label="Filter by role"><option value="">All roles</option>${roles.map(s=>`<option ${filters.role==s?"selected":""}>${esc(s)}</option>`).join("")}</select></div>`}
function bindTools(){$("#q").oninput=e=>{filters.q=e.target.value;const p=e.target.selectionStart;render(true);const i=$("#q");i.focus();i.setSelectionRange(p,p)};$("#fs").onchange=e=>{filters.stage=e.target.value;render()};$("#fr").onchange=e=>{filters.role=e.target.value;render()}}
function dash(){const n=data.length,cnt=s=>data.filter(c=>c.stage==s).length,active=data.filter(c=>!["Hired","Rejected"].includes(c.stage)).length,hired=cnt("Hired");
const hs=data.filter(c=>c.stage=="Hired").map(c=>(new Date(c.updated)-new Date(c.created))/864e5),avg=hs.length?Math.round(hs.reduce((a,b)=>a+b)/hs.length):"–";
const reachedOffer=data.filter(c=>c.history.some(h=>h.stage=="Offer")).length,max=Math.max(1,...ST.map(cnt));
const grp=k=>{const m={};data.forEach(c=>m[c[k]]=(m[c[k]]||0)+1);return Object.entries(m).sort((a,b)=>b[1]-a[1])};
const bars=(rows,m)=>rows.map(([l,v])=>`<div class="bar"><span>${esc(l)}</span><i style="width:${v/m*100}%"></i><b>${v}</b></div>`).join("")||`<div class="empty">No data yet.</div>`;
const recent=[...data].sort((a,b)=>new Date(b.created)-new Date(a.created)).slice(0,5);
return `<div class="stats"><div class="stat"><b>${n}</b><small>Total candidates</small></div><div class="stat"><b>${active}</b><small>In active pipeline</small></div><div class="stat"><b>${hired}</b><small>Hired</small></div><div class="stat"><b>${n?Math.round(hired/n*100):0}%</b><small>Hire rate</small></div><div class="stat"><b>${reachedOffer?Math.round(hired/reachedOffer*100):0}%</b><small>Offer acceptance</small></div><div class="stat"><b>${avg}${avg=="–"?"":" d"}</b><small>Avg. days to hire</small></div></div>
<div class="panel"><h2>Candidates by stage</h2>${bars(ST.map(s=>[s,cnt(s)]),max)}</div>
<div class="two"><div class="panel"><h2>By role</h2>${bars(grp("role"),Math.max(1,...grp("role").map(x=>x[1])))}</div><div class="panel"><h2>By source</h2>${bars(grp("source"),Math.max(1,...grp("source").map(x=>x[1])))}</div></div>
<div class="panel"><h2>Recently added</h2>${recent.map(c=>`<div class="bar" style="grid-template-columns:1fr auto auto"><button class="link" style="text-align:left" data-edit="${c.id}">${esc(c.name)} · ${esc(c.role)}</button><span class="tag ${c.stage}">${c.stage}</span><small>${fd(c.created)}</small></div>`).join("")||`<div class="empty">Add your first candidate to get started.</div>`}</div>`}
function boardV(){const f=filtered();return tools()+`<div class="board">${ST.map(s=>{const L=f.filter(c=>c.stage==s);return `<div class="col" data-stage="${s}"><h3>${s}<span>${L.length}</span></h3>${L.map(c=>`<div class="card" draggable="true" data-id="${c.id}"><b><button class="link" style="padding:0;text-align:left" data-edit="${c.id}">${esc(c.name)}</button></b><small>${esc(c.role)} · ${esc(c.source)}</small><select data-mv="${c.id}" aria-label="Move ${esc(c.name)} to stage">${ST.map(x=>`<option ${x==c.stage?"selected":""}>${x}</option>`).join("")}</select></div>`).join("")||`<small style="color:var(--mu)">Drop candidates here</small>`}</div>`}).join("")}</div>`}
function listV(){const f=filtered().sort((a,b)=>{const x=a[sort.k],y=b[sort.k];return (x>y?1:x<y?-1:0)*sort.d});
const th=(k,l)=>`<th data-sort="${k}">${l}${sort.k==k?(sort.d>0?" ▲":" ▼"):""}</th>`;
return tools()+`<div class="tw"><table><thead><tr>${th("name","Name")}${th("role","Role")}${th("source","Source")}${th("stage","Stage")}${th("updated","Updated")}<th></th></tr></thead><tbody>${f.map(c=>`<tr><td><b>${esc(c.name)}</b><br><small style="color:var(--mu)">${esc(c.email)}</small></td><td>${esc(c.role)}</td><td>${esc(c.source)}</td><td><span class="tag ${c.stage}">${c.stage}</span></td><td>${fd(c.updated)}</td><td><button class="link" data-edit="${c.id}">Edit</button></td></tr>`).join("")}</tbody></table>${f.length?"":`<div class="empty">No candidates match. Clear the search or filters, or add a new candidate.</div>`}</div>`}
function render(keep){["dash","board","list"].forEach(v=>$("#"+v).hidden=v!=view);
document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==view));
const el=$("#"+view);el.innerHTML=view=="dash"?dash():view=="board"?boardV():listV();
if(view!="dash")bindTools();
el.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openForm(b.dataset.edit));
el.querySelectorAll("[data-mv]").forEach(s=>s.onchange=()=>move(s.dataset.mv,s.value));
el.querySelectorAll("[data-sort]").forEach(h=>h.onclick=()=>{sort.d=sort.k==h.dataset.sort?-sort.d:1;sort.k=h.dataset.sort;render()});
el.querySelectorAll(".card").forEach(c=>c.ondragstart=e=>e.dataTransfer.setData("text/plain",c.dataset.id));
el.querySelectorAll(".col").forEach(c=>{c.ondragover=e=>{e.preventDefault();c.classList.add("over")};c.ondragleave=()=>c.classList.remove("over");c.ondrop=e=>{e.preventDefault();move(e.dataTransfer.getData("text/plain"),c.dataset.stage)}})}
function move(id,stage){const c=data.find(x=>x.id==id);if(!c||c.stage==stage){render();return}api("/candidates/"+id,{method:"PUT",body:JSON.stringify({stage})}).then(u=>{data=data.map(x=>x.id==id?u:x);render();toast(c.name+" moved to "+stage)}).catch(e=>{render();toast(e.message)})}
const dlg=$("#dlg");$("#s").innerHTML=ST.map(s=>`<option>${s}</option>`).join("");
function openForm(id){editId=id||null;const c=id?data.find(x=>x.id==id):{name:"",email:"",phone:"",role:"",stage:"Applied",source:"LinkedIn",notes:"",history:[]};
$("#dt").textContent=id?"Edit candidate":"Add candidate";$("#n").value=c.name;$("#e").value=c.email;$("#p").value=c.phone;$("#r").value=c.role;$("#s").value=c.stage;$("#src").value=c.source;$("#nt").value=c.notes;
$("#roles").innerHTML=[...new Set(data.map(x=>x.role))].map(r=>`<option value="${esc(r)}">`).join("");
$("#rm").hidden=!id;$("#hw").hidden=!id;$("#hist").innerHTML=c.history.map(h=>`<li>${h.stage} · ${fd(h.at)}</li>`).join("");dlg.showModal();$("#n").focus()}
$("#add").onclick=()=>openForm();$("#cx").onclick=()=>dlg.close();
$("#form").onsubmit=async e=>{e.preventDefault();const n=$("#n").value.trim(),em=$("#e").value.trim(),r=$("#r").value.trim();
if(!n||!r||!/^\S+@\S+\.\S+$/.test(em)){toast("Enter a name, role and valid email");return}
if(data.some(x=>x.email.toLowerCase()==em.toLowerCase()&&x.id!=editId)){toast("A candidate with this email already exists");return}
const f={name:n,email:em,phone:$("#p").value.trim(),role:r,stage:$("#s").value,source:$("#src").value,notes:$("#nt").value.trim()};
try{if(editId){const u=await api("/candidates/"+editId,{method:"PUT",body:JSON.stringify(f)});data=data.map(x=>x.id==editId?u:x)}else data.unshift(await api("/candidates",{method:"POST",body:JSON.stringify(f)}));dlg.close();render();toast("Saved")}catch(err){toast(err.message)}};
$("#rm").onclick=async()=>{if(confirm("Delete this candidate? This cannot be undone.")){try{await api("/candidates/"+editId,{method:"DELETE"});data=data.filter(x=>x.id!=editId);dlg.close();render();toast("Deleted")}catch(e){toast(e.message)}}};
$("#nav").onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;render()}};
$("#exp").onclick=()=>{const rows=[["Name","Email","Phone","Role","Source","Stage","Created","Updated","Notes"],...data.map(c=>[c.name,c.email,c.phone,c.role,c.source,c.stage,c.created,c.updated,c.notes])];
const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="candidates.csv";a.click();toast("Exported")};
api("/candidates").then(d=>{data=d;render()}).catch(()=>{render();toast("Cannot reach the API. Is the server running?")});
</script>
</body>
</html>
